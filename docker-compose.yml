# Prototype: OIDC login with role-based edge caching for WordPress
#
#   Browser ──► www.example.localhost:8000 ──► haproxy ──► varnish ──► wordpress ──► db
#               community.example.localhost:8000 ──┘  └──► auth (community app stand-in, OIDC RP)
#      └──────► auth.example.localhost:8080 (keycloak, playing the IdP)
#
# Only HAProxy and Keycloak publish ports. Varnish, the auth service and WordPress are reachable
# on the Docker network only; in production a firewall or private network must guarantee the
# same, otherwise X-Example-Role could be forged.

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  # Executed by wp-config.php via eval(), also inside the wp-cli container.
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'http://www.example.localhost:8000');
    define('WP_SITEURL', 'http://www.example.localhost:8000');
    define('EXAMPLE_ROLE_CACHE_TTL', 60);
    define('DISABLE_WP_CRON', true);

x-wp-volumes: &wp-volumes
  - wp-data:/var/www/html
  - ./wordpress/plugins/example-role:/var/www/html/wp-content/plugins/example-role

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
    volumes: *wp-volumes

  # One-time setup via wp-cli: installation, permalinks, plugin, demo pages. Idempotent.
  wp-init:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      <<: *wp-env
      WP_URL: http://www.example.localhost:8000
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
    volumes:
      - wp-data:/var/www/html
      - ./wordpress/plugins/example-role:/var/www/html/wp-content/plugins/example-role
      - ./wordpress/init.sh:/init.sh:ro
      - ./wordpress/content:/content:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      # Browser and auth service both reach Keycloak at auth.example.localhost:8080 (see
      # extra_hosts on auth), so the issuer, the discovery document and all endpoints share one URL.
      KC_HOSTNAME: http://auth.example.localhost:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      # No persistence: the realm is imported fresh on every start (dev mode, H2 inside the container).
      - ./keycloak:/opt/keycloak/data/import:ro

  # Stand-in for the community app: the OIDC relying party. Sets the login cookie for the whole
  # example.localhost domain and redirects back to wherever the user came from.
  auth:
    build: ./auth
    command: ["node", "--watch", "src/index.js"]
    depends_on:
      - keycloak
    environment:
      PORT: "3000"
      APP_URL: http://community.example.localhost:8000
      SITE_URL: http://www.example.localhost:8000
      COOKIE_DOMAIN: example.localhost
      # The cookie outlives the id_token so that an expired token can trigger the silent re-login.
      COOKIE_MAX_AGE_SECONDS: ${COOKIE_MAX_AGE_SECONDS:-43200}
      ALLOWED_RETURN_HOSTS: www.example.localhost:8000,community.example.localhost:8000
      OIDC_ISSUER: http://auth.example.localhost:8080/realms/example
      OIDC_CLIENT_ID: community-app
      OIDC_CLIENT_SECRET: ${CLIENT_SECRET:-community-app-demo-secret}
      AUTH_STATE_SECRET: ${AUTH_STATE_SECRET:-demo-auth-state-secret-please-change-0123456789}
      DEBUG_CLAIMS: "1"
    # Inside the container, auth.example.localhost resolves to the Docker host, where Keycloak's
    # port 8080 is published. The service therefore uses the same IdP URL as the browser and
    # openid-client's strict issuer check during discovery passes.
    extra_hosts:
      - "auth.example.localhost:host-gateway"
    volumes:
      - ./auth/src:/app/src:ro

  # Cache per access level. Trusts X-Example-Role because only HAProxy can reach it.
  varnish:
    image: varnish:7.7
    command: ["-p", "default_ttl=${DEFAULT_CACHE_TTL_SECONDS:-60}"]
    depends_on:
      - wordpress
    environment:
      VARNISH_SIZE: 100M
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - ./varnish/edge.vcl:/etc/varnish/edge.vcl:ro

  # The edge: verifies the id_token cookie, sets X-Example-Role, routes by hostname.
  haproxy:
    image: haproxy:3.2
    ports:
      - "8000:8000"
    depends_on:
      - varnish
      - auth
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/idp-public.pem:/usr/local/etc/haproxy/idp-public.pem:ro

volumes:
  db-data:
  wp-data:
