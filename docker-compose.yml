# Prototype: OIDC login with role-based edge caching for WordPress
#
#   Browser ──► www.localhost:8000 (varnish) ──► wordpress:80 ──► db
#                        └── /auth/* ──► auth:3000 (Express, OIDC relying party)
#      └──────► auth.localhost:8080 (keycloak)   ◄── auth service (via extra_hosts → Docker host)
#
# WordPress is additionally exposed on localhost:8081, only to show that
# direct access without the edge is rejected with 403.

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  # Executed by wp-config.php via eval(), also inside the wp-cli container.
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'http://www.localhost:8000');
    define('WP_SITEURL', 'http://www.localhost:8000');
    define('EDGE_SHARED_SECRET', '${EDGE_SHARED_SECRET:-edge-to-origin-demo-secret}');
    define('EXAMPLE_ROLE_CACHE_TTL', 60);
    define('DISABLE_WP_CRON', true);

x-wp-volumes: &wp-volumes
  - wp-data:/var/www/html
  - ./wordpress/plugins/example-role:/var/www/html/wp-content/plugins/example-role
  - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      <<: *wp-env
    volumes: *wp-volumes

  # One-time setup via wp-cli: installation, permalinks, plugin, demo pages. Idempotent.
  wp-init:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      <<: *wp-env
      WP_URL: http://www.localhost:8000
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
    volumes:
      - wp-data:/var/www/html
      - ./wordpress/plugins/example-role:/var/www/html/wp-content/plugins/example-role
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/init.sh:/init.sh:ro
      - ./wordpress/content:/content:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      # Browser and edge both reach Keycloak at auth.localhost:8080 (see extra_hosts on edge),
      # so the issuer, the discovery document and all endpoints share one URL.
      KC_HOSTNAME: http://auth.localhost:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      # No persistence: the realm is imported fresh on every start (dev mode, H2 inside the container).
      - ./keycloak:/opt/keycloak/data/import:ro

  # OIDC relying party. Only reachable through Varnish (/auth/*), no published port.
  auth:
    build: ./auth
    command: ["node", "--watch", "src/index.js"]
    depends_on:
      - keycloak
    environment:
      PORT: "3000"
      PUBLIC_URL: http://www.localhost:8000
      OIDC_ISSUER: http://auth.localhost:8080/realms/example
      OIDC_CLIENT_ID: example-web
      OIDC_CLIENT_SECRET: ${CLIENT_SECRET:-example-web-demo-secret}
      OIDC_ROLE_CLAIM: example_role
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-please-change-0123456789abcdef}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-900}
      SESSION_COOKIE_MAX_AGE_SECONDS: ${SESSION_COOKIE_MAX_AGE_SECONDS:-43200}
      DEBUG_CLAIMS: "1"
    # Inside the container, auth.localhost resolves to the Docker host, where Keycloak's port 8080
    # is published. The service therefore uses the same IdP URL as the browser and openid-client's
    # strict issuer check during discovery passes.
    extra_hosts:
      - "auth.localhost:host-gateway"
    volumes:
      - ./auth/src:/app/src:ro

  # The edge: Varnish verifies the session JWT in VCL, sets X-Example-Role, caches per role.
  varnish:
    build: ./varnish
    # Extra varnishd parameters; the entrypoint adds the standard ones.
    command: ["-p", "default_ttl=${DEFAULT_CACHE_TTL_SECONDS:-60}"]
    ports:
      - "8000:8000"
    depends_on:
      - wordpress
      - auth
    environment:
      VARNISH_HTTP_PORT: "8000"
      VARNISH_SIZE: 100M
      SESSION_SECRET: ${SESSION_SECRET:-demo-session-secret-please-change-0123456789abcdef}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:-edge-to-origin-demo-secret}

volumes:
  db-data:
  wp-data:
