# HAProxy in front of the website: derives the access level from the login cookie.
#
#   www.example.localhost:8000 -> varnish -> wordpress   (X-Example-Role set here)
#
# The login cookie is set by the community app for the whole parent domain. It holds the IdP's
# id_token, encrypted with AES-256-GCM and a random nonce (nonce.ciphertext.tag, base64) so that
# no other host under the domain can read it. HAProxy decrypts it with the key shared with the
# community app (LOGIN_COOKIE_KEY), then verifies the RS256 signature with the IdP's public key on
# disk (idp-public.pem), checks iss and exp, reads the role claim, strips the cookie and sets the
# header. There is no audience check: the encryption already binds the cookie to the community
# app, which only wraps tokens issued to its own client. The key only protects confidentiality: whoever has it can read tokens but not forge
# them, because the signature is the IdP's. Anything that fails becomes "none".
# Varnish and WordPress must only be reachable here.
#
# Everything environment-specific comes from the environment (HAProxy expands ${VAR} at parse
# time), so the same config can be pointed at a real community app and IdP:
#   LOGIN_COOKIE_NAME  cookie name                      LOGIN_COOKIE_KEY  32-byte AES key, base64
#   OIDC_ISSUER        expected iss
#   ROLE_CLAIM         claim holding the level
#   REFRESH_URL        the community app's silent-refresh endpoint

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    default-server init-addr last,libc,none

frontend website
    bind :8000

    # Nothing the client claims is trusted; the role comes only from a verified token.
    http-request del-header X-Example-Role
    http-request set-var(txn.role) str(none)
    http-request set-var(txn.now) date()

    # Decrypt the cookie. A missing, malformed or tampered blob yields an empty token.
    # ${VAR} inside a fetch argument is only expanded when the argument is double-quoted.
    http-request set-var(txn.nonce) req.cook("${LOGIN_COOKIE_NAME}"),field(1,.)
    http-request set-var(txn.tag)   req.cook("${LOGIN_COOKIE_NAME}"),field(3,.)
    acl has_cookie req.cook("${LOGIN_COOKIE_NAME}") -m found
    http-request set-var(txn.token) req.cook("${LOGIN_COOKIE_NAME}"),field(2,.),b64dec,aes_gcm_dec(256,txn.nonce,"${LOGIN_COOKIE_KEY}",txn.tag) if has_cookie
    acl has_token var(txn.token) -m found
    acl alg_ok    var(txn.token),jwt_header_query('$.alg') -m str RS256
    acl sig_ok    var(txn.token),jwt_verify("RS256","/usr/local/etc/haproxy/idp-public.pem") -m int 1
    acl iss_ok    var(txn.token),jwt_payload_query('$.iss') -m str "${OIDC_ISSUER}"
    http-request set-var(txn.exp) var(txn.token),jwt_payload_query('$.exp','int') if has_token
    acl not_expired var(txn.exp),sub(txn.now) -m int gt 0

    http-request set-var(txn.state) str(valid)   if has_token alg_ok sig_ok iss_ok not_expired
    http-request set-var(txn.state) str(expired) if has_token alg_ok sig_ok iss_ok !not_expired
    acl valid   var(txn.state) -m str valid
    acl expired var(txn.state) -m str expired

    # The level is whatever the IdP issued; which levels exist is the community app's and the
    # website's business, not the edge's. Only the shape is checked, so that the header and the
    # cache key never carry arbitrary text. Anything else, including a missing claim, is "none".
    http-request set-var(txn.role) var(txn.token),jwt_payload_query("\$.${ROLE_CLAIM}") if valid
    acl role_wellformed var(txn.role) -m reg ^[A-Za-z0-9_-]{1,32}$
    http-request set-var(txn.role) str(none) if !role_wellformed

    # Expired token on an HTML navigation: one silent re-login via the community app.
    # No loop is possible: if the silent login fails, the community app deletes the cookie.
    acl wants_html req.hdr(Accept) -m sub text/html
    http-request redirect code 302 location "${REFRESH_URL}?return=http%%3A%%2F%%2F%[req.hdr(host),url_enc]%[pathq,url_enc]" if expired wants_html METH_GET

    # The login cookie never reaches Varnish or WordPress, valid or not. Other cookies pass through.
    http-request replace-header Cookie "^(.*?)(?:^|;\s*)${LOGIN_COOKIE_NAME}=[^;]*(.*)\$" \1\2 if has_cookie
    http-request replace-header Cookie ^;\s*(.*)$ \1 if { req.hdr(Cookie) -m beg ; }
    http-request del-header Cookie if { req.hdr(Cookie) -m len 0 }

    http-request set-header X-Example-Role %[var(txn.role)]

    default_backend varnish

backend varnish
    server varnish varnish:80 check
