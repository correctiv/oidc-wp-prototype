# HAProxy in front of everything: validates the login cookie and derives the access level for
# the website, routes the community app by hostname.
#
#   www.example.localhost:8000        -> varnish -> wordpress   (X-Example-Role set here)
#   community.example.localhost:8000  -> auth (the community app, OIDC relying party)
#
# The cookie holds the IdP's id_token. HAProxy verifies its RS256 signature with the IdP's public
# key on disk (idp-public.pem), checks iss, aud and exp, and reads the role claim. Anything that
# fails becomes "none". Varnish and WordPress must only be reachable through this HAProxy.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    default-server init-addr last,libc,none

frontend public
    bind :8000

    acl host_community req.hdr(host),field(1,:) -i community.example.localhost

    # --- Website: access level from the id_token cookie -----------------------------------
    # Nothing the client claims is trusted; the role comes only from a verified token.
    http-request del-header X-Example-Role
    http-request set-var(txn.role) str(none)
    http-request set-var(txn.now) date()

    http-request set-var(txn.token) req.cook(example_session) if !host_community
    acl has_token var(txn.token) -m found
    acl alg_ok    var(txn.token),jwt_header_query('$.alg') -m str RS256
    acl sig_ok    var(txn.token),jwt_verify("RS256","/usr/local/etc/haproxy/idp-public.pem") -m int 1
    acl iss_ok    var(txn.token),jwt_payload_query('$.iss') -m str "http://auth.example.localhost:8080/realms/example"
    acl aud_ok    var(txn.token),jwt_payload_query('$.aud') -m str community-app
    http-request set-var(txn.exp) var(txn.token),jwt_payload_query('$.exp','int') if has_token
    acl not_expired var(txn.exp),sub(txn.now) -m int gt 0

    http-request set-var(txn.state) str(valid)   if has_token alg_ok sig_ok iss_ok aud_ok not_expired
    http-request set-var(txn.state) str(expired) if has_token alg_ok sig_ok iss_ok aud_ok !not_expired
    acl valid   var(txn.state) -m str valid
    acl expired var(txn.state) -m str expired

    http-request set-var(txn.role) var(txn.token),jwt_payload_query('$.example_role') if valid
    acl role_known var(txn.role) -m str limited full
    http-request set-var(txn.role) str(none) if !role_known

    # Expired token on an HTML navigation: one silent re-login via the community app.
    # No loop is possible: if the silent login fails, the community app deletes the cookie.
    acl wants_html req.hdr(Accept) -m sub text/html
    http-request redirect code 302 location "http://community.example.localhost:8000/auth/refresh?return=http%%3A%%2F%%2F%[req.hdr(host),url_enc]%[pathq,url_enc]" if !host_community expired wants_html METH_GET

    # The login cookie never reaches Varnish or WordPress. Other cookies pass through.
    http-request replace-header Cookie ^(.*?)(?:^|;\s*)example_session=[^;]*(.*)$ \1\2 if !host_community has_token
    http-request replace-header Cookie ^;\s*(.*)$ \1 if !host_community has_token
    http-request del-header Cookie if !host_community { req.hdr(Cookie) -m len 0 }

    http-request set-header X-Example-Role %[var(txn.role)] if !host_community

    use_backend community if host_community
    default_backend website

backend website
    server varnish varnish:80 check

backend community
    server community auth:3000 check
