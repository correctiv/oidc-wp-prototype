# HAProxy in front of the website: owns the website's login cookie and derives the access level.
#
#   www.example.localhost:8000 -> varnish -> wordpress   (X-Example-Role set here)
#
# The cookie is host-only for the website. It is set and cleared by two endpoints answered here:
#   POST /auth/session   the community app (a separate service, not behind this HAProxy) posts the
#                        IdP's id_token here after login; HAProxy verifies it and sets the cookie
#   GET  /auth/clear     removes the cookie (logout, failed silent refresh)
# Every other request: verify the cookie's RS256 signature with the IdP's public key on disk
# (idp-public.pem), check iss, aud and exp, read the role claim, strip the cookie, set the
# header. Anything that fails becomes "none". Varnish and WordPress must only be reachable here.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    default-server init-addr last,libc,none

frontend website
    bind :8000
    # Needed to read the form body of POST /auth/session. Bodies are small (WordPress forms, one token).
    option http-buffer-request

    acl path_session path /auth/session
    acl path_clear   path /auth/clear
    acl origin_community req.hdr(Origin) -m str http://community.example.localhost:8001

    # Nothing the client claims is trusted; the role comes only from a verified token.
    http-request del-header X-Example-Role
    http-request set-var(txn.role) str(none)
    http-request set-var(txn.now) date()

    # The token comes from the cookie, or from the form body on the hand-over endpoint.
    http-request set-var(txn.token) req.body_param(token) if path_session METH_POST
    http-request set-var(txn.token) req.cook(example_session) if !path_session
    acl has_token var(txn.token) -m found
    acl alg_ok    var(txn.token),jwt_header_query('$.alg') -m str RS256
    acl sig_ok    var(txn.token),jwt_verify("RS256","/usr/local/etc/haproxy/idp-public.pem") -m int 1
    acl iss_ok    var(txn.token),jwt_payload_query('$.iss') -m str "http://auth.example.localhost:8080/realms/example"
    acl aud_ok    var(txn.token),jwt_payload_query('$.aud') -m str community-app
    http-request set-var(txn.exp) var(txn.token),jwt_payload_query('$.exp','int') if has_token
    acl not_expired var(txn.exp),sub(txn.now) -m int gt 0

    http-request set-var(txn.state) str(valid)   if has_token alg_ok sig_ok iss_ok aud_ok not_expired
    http-request set-var(txn.state) str(expired) if has_token alg_ok sig_ok iss_ok aud_ok !not_expired
    acl valid   var(txn.state) -m str valid
    acl expired var(txn.state) -m str expired

    # --- Hand-over and clear -----------------------------------------------------------------
    # Where to send the browser afterwards: a path on this site, or one of the two known hosts.
    http-request set-var(txn.return) req.body_param(return),url_dec if path_session
    http-request set-var(txn.return) url_param(return),url_dec if path_clear
    acl return_ok  var(txn.return) -m beg / http://www.example.localhost:8000/ http://community.example.localhost:8001/
    acl return_bad var(txn.return) -m beg // '/\'
    http-request set-var(txn.return) str(/) if path_session !return_ok
    http-request set-var(txn.return) str(/) if path_session return_bad
    http-request set-var(txn.return) str(/) if path_clear !return_ok
    http-request set-var(txn.return) str(/) if path_clear return_bad

    # Only the community app's form may set the cookie (browsers always send Origin on cross-origin
    # POSTs), and only with a token that passes the same checks as on every other request.
    http-request deny deny_status 403 if path_session METH_POST !origin_community
    http-request return status 302 hdr Location %[var(txn.return)] hdr Cache-Control no-store hdr Set-Cookie "example_session=%[var(txn.token)]; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200" if path_session METH_POST valid
    http-request deny deny_status 400 if path_session
    http-request return status 302 hdr Location %[var(txn.return)] hdr Cache-Control no-store hdr Set-Cookie "example_session=; Path=/; HttpOnly; SameSite=Lax; Max-Age=0" if path_clear
    # Production: name the cookie __Host-example_session and add Secure. Both need https, which
    # the local prototype does not have.

    # --- Every other request --------------------------------------------------------------------
    http-request set-var(txn.role) var(txn.token),jwt_payload_query('$.example_role') if valid
    acl role_known var(txn.role) -m str limited full
    http-request set-var(txn.role) str(none) if !role_known

    # Expired token on an HTML navigation: one silent re-login via the community app.
    # No loop is possible: if the silent login fails, the community app sends the browser to /auth/clear.
    acl wants_html req.hdr(Accept) -m sub text/html
    http-request redirect code 302 location "http://community.example.localhost:8001/auth/refresh?return=http%%3A%%2F%%2F%[req.hdr(host),url_enc]%[pathq,url_enc]" if expired wants_html METH_GET

    # The login cookie never reaches Varnish or WordPress. Other cookies pass through.
    http-request replace-header Cookie ^(.*?)(?:^|;\s*)example_session=[^;]*(.*)$ \1\2 if has_token
    http-request replace-header Cookie ^;\s*(.*)$ \1 if has_token
    http-request del-header Cookie if { req.hdr(Cookie) -m len 0 }

    http-request set-header X-Example-Role %[var(txn.role)]

    default_backend varnish

backend varnish
    server varnish varnish:80 check
